<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trang Hồ Sơ Cá Nhân</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background: #f0f2f5;
            }

            .profile-card {
                background-color: #ffffff;
                width: 100%;
                max-width: 380px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                text-align: center;
                overflow: hidden;
            }

            .profile-cover {
                height: 120px;
                background: linear-gradient(135deg, #007bff, #00d2ff);
            }

            .profile-content {
                padding: 0 24px 30px 24px;
                position: relative;
            }

            .profile-avatar {
                width: 110px;
                height: 110px;
                border-radius: 50%;
                object-fit: cover;
                border: 4px solid #ffffff;
                background-color: #e4e6eb;
                margin-top: -55px;
                margin-bottom: 15px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            .profile-username {
                font-size: 22px;
                font-weight: 700;
                color: #333333;
                margin-bottom: 4px;
            }

            .profile-email {
                font-size: 14px;
                color: #65676b;
                font-weight: 500;
                margin-bottom: 20px;
            }

            .btn-action {
                display: inline-block;
                width: 100%;
                padding: 10px 0;
                background-color: #e4e6eb;
                color: #050505;
                border: none;
                border-radius: 6px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s;
                text-decoration: none;
            }

            .btn-action:hover {
                background-color: #d8dadf;
            }
        </style>
    </head>
    <body>
        <div class="profile-card">
            <div class="profile-cover"></div>

            <div class="profile-content">
                <img class="profile-avatar" src="" alt="User Avatar" />

                <h2 class="profile-username"></h2>

                <p class="profile-email"></p>

                <button class="btn-action">Chỉnh sửa hồ sơ</button>
            </div>
        </div>

        <script src="./profile.js"></script>
    </body>
</html>
